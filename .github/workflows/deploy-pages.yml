# Deploy docs/ to GitHub Pages (mirrored from output/ by update_promotions.py).
# Requires: Settings → Pages → Source = "GitHub Actions"
# If Actions fail with a billing lock, use branch deploy: main /docs (no workflow needed).

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify site files
        run: |
          test -f docs/index.html || (echo "Missing docs/index.html — run update_promotions.py" && exit 1)
          test -f docs/promotions.csv || (echo "Missing docs/promotions.csv" && exit 1)

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
