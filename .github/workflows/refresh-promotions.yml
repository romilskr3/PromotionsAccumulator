# Manual: Actions → Refresh promotions data → Run workflow.
# Site: Refresh data button (GitHub PAT in browser) or ./scripts/refresh_and_push.sh

name: Refresh promotions data

on:
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-promotions]

permissions:
  contents: write

concurrency:
  group: refresh-promotions
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e .
          playwright install --with-deps chrome

      - name: Cache SuperValu leaflet PDF
        uses: actions/cache@v5
        with:
          path: leaflets/supervalu
          key: supervalu-leaflet-${{ runner.os }}-${{ hashFiles('fetchers/supervalu/**') }}
          restore-keys: |
            supervalu-leaflet-${{ runner.os }}-

      - name: Fetch promotions and update outputs
        run: python3 scripts/update_promotions.py --refresh-leaflets

      - name: Verify Tesco Fresh 4 refreshed
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          rows = list(csv.DictReader(Path("output/promotions.csv").open()))
          live = [
              r for r in rows
              if r.get("Supermarket") == "Tesco"
              and r.get("Status") == "Live"
          ]
          if not live:
              print(
                  "Warning: no Live Tesco Fresh 4 rows after refresh. "
                  "Check fetchers/tesco and Playwright Chrome install."
              )
          else:
              print(f"Tesco: {len(live)} live promotion(s)")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ docs/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Refresh promotions data [automated]"
            git push
          fi
