# Manual run: Actions → Refresh promotions data → Run workflow.
# Local fallback: ./scripts/refresh_and_push.sh

name: Refresh promotions data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-promotions
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e .
          playwright install --with-deps chromium

      - name: Cache SuperValu leaflet PDF
        uses: actions/cache@v4
        with:
          path: leaflets/supervalu
          key: supervalu-leaflet-${{ runner.os }}-${{ hashFiles('fetchers/supervalu/**') }}
          restore-keys: |
            supervalu-leaflet-${{ runner.os }}-

      - name: Restore Tesco browser session (optional)
        env:
          TESCO_STORAGE_STATE_B64: ${{ secrets.TESCO_STORAGE_STATE_B64 }}
        run: |
          if [ -n "$TESCO_STORAGE_STATE_B64" ]; then
            mkdir -p leaflets/tesco
            echo "$TESCO_STORAGE_STATE_B64" | base64 -d > leaflets/tesco/storage-state.json
          fi

      - name: Fetch promotions and update outputs
        run: python3 scripts/update_promotions.py --refresh-leaflets

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ docs/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Refresh promotions data [automated]"
            git push
          fi
