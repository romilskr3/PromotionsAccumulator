# Disabled while GitHub Actions billing blocks hosted runners.
# Re-enable the `issues` trigger and remove `if: false` when billing works.
# Until then: run scripts/refresh_and_push.sh locally, then Reload data on the site.

name: Refresh promotions data

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-promotions
  cancel-in-progress: true

jobs:
  refresh:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -e .
          playwright install --with-deps chromium
          python3 scripts/update_promotions.py --refresh-leaflets
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ docs/
          git diff --staged --quiet || git commit -m "Refresh promotions data [automated]"
          git push
