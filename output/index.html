<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fruit &amp; Vegetable Promotions — Dublin</title>
  <style>
    :root {
      --bg: #f0f2f5;
      --card: #fff;
      --text: #1c2127;
      --muted: #5c6570;
      --border: #dde3ea;
      --accent: #2563eb;
      --active: #15803d;
      --inactive: #94a3b8;
      --fruit: #ea580c;
      --fruit-soft: #fff7ed;
      --veg: #16a34a;
      --veg-soft: #f0fdf4;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 4px 12px rgba(15, 23, 42, 0.04);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(165deg, #eef2f7 0%, var(--bg) 40%, #e8eef4 100%);
      color: var(--text);
      line-height: 1.45;
      min-height: 100vh;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
    .page-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .page-header h1 {
      font-size: 1.65rem;
      font-weight: 700;
      margin: 0 0 0.2rem;
      letter-spacing: -0.02em;
    }
    .meta { color: var(--muted); font-size: 0.875rem; margin: 0; }
    .meta.error { color: #b42318; }
    #refresh-btn {
      font: inherit;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(37, 99, 235, 0.25);
    }
    #refresh-btn:hover:not(:disabled) { filter: brightness(1.06); }
    #refresh-btn:disabled { opacity: 0.65; cursor: wait; }
    .refresh-hint {
      color: var(--muted);
      font-size: 0.85rem;
      margin: 0 0 0.75rem;
    }
    .local-refresh-help {
      font-size: 0.85rem;
      color: var(--muted);
      margin: 0 0 1rem;
    }
    .local-refresh-help summary { cursor: pointer; color: var(--accent); }
    .local-refresh-help pre {
      margin: 0.5rem 0 0;
      padding: 0.75rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow-x: auto;
      font-size: 0.8rem;
    }
    .category-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      padding: 0.35rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }
    .category-tabs button {
      flex: 1;
      font: inherit;
      font-weight: 600;
      font-size: 1rem;
      padding: 0.75rem 1rem;
      border: 2px solid transparent;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .category-tabs button .tab-count {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      background: rgba(0,0,0,0.06);
      min-width: 1.5rem;
      text-align: center;
    }
    .category-tabs button[data-category="fruit"][aria-selected="true"] {
      background: var(--fruit-soft);
      border-color: var(--fruit);
      color: #9a3412;
    }
    .category-tabs button[data-category="fruit"][aria-selected="true"] .tab-count {
      background: var(--fruit);
      color: #fff;
    }
    .category-tabs button[data-category="vegetable"][aria-selected="true"] {
      background: var(--veg-soft);
      border-color: var(--veg);
      color: #166534;
    }
    .category-tabs button[data-category="vegetable"][aria-selected="true"] .tab-count {
      background: var(--veg);
      color: #fff;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      align-items: center;
      margin-bottom: 0.85rem;
    }
    .filters button {
      font: inherit;
      font-size: 0.875rem;
      padding: 0.4rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      cursor: pointer;
      color: var(--text);
    }
    .filters button[aria-pressed="true"] {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }
    #search {
      flex: 1;
      min-width: 180px;
      padding: 0.5rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      font: inherit;
      background: var(--card);
    }
    #search:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    .count { color: var(--muted); font-size: 0.875rem; }
    .card {
      background: var(--card);
      border-radius: 14px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.925rem; }
    th, td { padding: 0.7rem 1rem; text-align: left; border-bottom: 1px solid var(--border); }
    th {
      background: #f8fafc;
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    th:hover { background: #f1f5f9; }
    th .sort::after { content: " \2195"; opacity: 0.35; font-size: 0.75em; }
    th[data-sort-dir="asc"] .sort::after { content: " \2191"; opacity: 1; color: var(--text); }
    th[data-sort-dir="desc"] .sort::after { content: " \2193"; opacity: 1; color: var(--text); }
    tbody tr:hover td { background: #fafbfc; }
    tr:last-child td { border-bottom: none; }
    tr[data-active="false"] { opacity: 0.65; }
    .store {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      background: #f1f5f9;
      color: #334155;
    }
    .store.lidl { background: #0050aa18; color: #0050aa; }
    .store.aldi { background: #00a65018; color: #007a3d; }
    .store.tesco { background: #ee1c2e18; color: #c8102e; }
    .price { font-weight: 600; font-variant-numeric: tabular-nums; }
    .product-name { font-weight: 500; }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge.active { background: #dcfce7; color: var(--active); }
    .badge.inactive { background: #f1f5f9; color: var(--inactive); }
    .empty-row td {
      text-align: center;
      color: var(--muted);
      padding: 2rem 1rem;
      font-style: italic;
    }
    @media (max-width: 720px) {
      .card { overflow-x: auto; }
      table { min-width: 680px; }
      .category-tabs button { font-size: 0.9rem; padding: 0.65rem 0.5rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="page-header">
      <div>
        <h1>Dublin produce promotions</h1>
        <p class="meta" id="meta">Loading promotions…</p>
      </div>
      <button type="button" id="refresh-btn" title="Reload promotions.csv from GitHub">Reload data</button>
    </div>
    <p class="refresh-hint" id="refresh-hint" hidden></p>
    <details class="local-refresh-help">
      <summary>Fetch new leaflets (run on your Mac)</summary>
      <pre>python3 scripts/update_promotions.py
git add output/ docs/
git commit -m "Update promotions"
git push</pre>
      <p>Then click <strong>Reload data</strong>.</p>
    </details>

    <div class="category-tabs" role="tablist" aria-label="Produce category">
      <button type="button" role="tab" id="tab-fruit" data-category="fruit" aria-selected="true" aria-controls="promo-panel">
        <span>Fruits</span>
        <span class="tab-count" id="tab-fruit-count">0</span>
      </button>
      <button type="button" role="tab" id="tab-vegetable" data-category="vegetable" aria-selected="false" aria-controls="promo-panel">
        <span>Vegetables</span>
        <span class="tab-count" id="tab-vegetable-count">0</span>
      </button>
    </div>

    <div class="toolbar">
      <div class="filters" role="group" aria-label="Filter by active status">
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="active" aria-pressed="false">Active</button>
        <button type="button" data-filter="inactive" aria-pressed="false">Not active</button>
      </div>
      <input id="search" type="search" placeholder="Search in this tab…" autocomplete="off" />
      <span class="count" id="count"></span>
    </div>

    <div class="card" id="promo-panel" role="tabpanel">
      <table id="promo-table">
        <thead>
          <tr>
            <th data-key="supermarket">Store<span class="sort"></span></th>
            <th data-key="product">Product<span class="sort"></span></th>
            <th data-key="quantity">Qty<span class="sort"></span></th>
            <th data-key="price">Price<span class="sort"></span></th>
            <th data-key="from">From<span class="sort"></span></th>
            <th data-key="until">Until<span class="sort"></span></th>
            <th data-key="active">Status<span class="sort"></span></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
  <script>
    const CSV_URL = "promotions.csv";
    let ROWS = [];
    let lastGenerated = "";
    let categoryTab = "fruit";
    let statusFilter = "all";
    let sortKey = "supermarket";
    let sortDir = "asc";

    const tbody = document.getElementById("tbody");
    const countEl = document.getElementById("count");
    const metaEl = document.getElementById("meta");
    const searchEl = document.getElementById("search");
    const refreshBtn = document.getElementById("refresh-btn");
    const refreshHint = document.getElementById("refresh-hint");

    const VEG_FIRST = /\b(tomato|potato|onion|shallot|pepper|cucumber|broccoli|mushroom|radish|salad|courgette|carrot|cabbage|lettuce|spinach|leek|garlic|cauliflower|aubergine|asparagus|beans?\b|peas?\b)\b/i;
    const FRUIT = /\b(mango|oranges?|pears?|apples?|easypeelers|satsuma|clementine|mandarin|grapefruit|lemon|lime|grape|melon|pineapple|peach|strawber|blueber|raspber|banana|kiwi|fig\b|apricot|nectarine|avocado|coconut|pomegranate|rhubarb)\b/i;

    function classifyProduct(name) {
      const text = name.toLowerCase();
      if (text.includes("salad trio")) return "vegetable";
      if (VEG_FIRST.test(name)) return "vegetable";
      if (FRUIT.test(name)) return "fruit";
      return "vegetable";
    }

    function storeClass(name) {
      const s = name.toLowerCase();
      if (s.includes("lidl")) return "lidl";
      if (s.includes("aldi")) return "aldi";
      if (s.includes("tesco")) return "tesco";
      return "";
    }

    function parseCsvLine(line) {
      const fields = [];
      let field = "";
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (inQuotes) {
          if (c === '"') {
            if (line[i + 1] === '"') { field += '"'; i++; }
            else inQuotes = false;
          } else field += c;
        } else if (c === '"') inQuotes = true;
        else if (c === ",") { fields.push(field); field = ""; }
        else field += c;
      }
      fields.push(field);
      return fields;
    }

    function csvToRows(text) {
      let generated = "";
      const trimmed = text.replace(/^\uFEFF/, "");
      const lines = trimmed.split(/\r?\n/).filter((l) => l.length);
      const dataLines = [];
      for (const line of lines) {
        if (line.startsWith("# Generated:")) {
          generated = line.replace(/^# Generated:\s*/, "").trim();
        } else dataLines.push(line);
      }
      const parsed = dataLines.map(parseCsvLine);
      if (!parsed.length) return { generated, rows: [] };
      const headers = parsed[0].map((h) => h.trim());
      const rows = parsed.slice(1).filter((r) => r.some((c) => c.trim())).map((cells) => {
        const rec = {};
        headers.forEach((h, i) => { rec[h] = (cells[i] ?? "").trim(); });
        let category = (rec["category"] ?? "").toLowerCase();
        if (category !== "fruit" && category !== "vegetable") {
          category = classifyProduct(rec["Product"] ?? "");
        }
        return {
          supermarket: rec["Supermarket"] ?? "",
          product: rec["Product"] ?? "",
          quantity: rec["Quantity"] ?? "",
          price: rec["Price"] ?? "",
          from: rec["From Date"] ?? "",
          until: rec["Until Date"] ?? "",
          from_sort: rec["from_sort"] ?? "",
          until_sort: rec["until_sort"] ?? "",
          active: (rec["Active today"] ?? "").toLowerCase() === "true",
          category,
        };
      });
      return { generated, rows };
    }

    function updateTabCounts() {
      const fruits = ROWS.filter((r) => r.category === "fruit").length;
      const veg = ROWS.filter((r) => r.category === "vegetable").length;
      document.getElementById("tab-fruit-count").textContent = fruits;
      document.getElementById("tab-vegetable-count").textContent = veg;
    }

    function render() {
      const q = searchEl.value.trim().toLowerCase();
      let visible = ROWS.filter((row) => {
        if (row.category !== categoryTab) return false;
        if (statusFilter === "active" && !row.active) return false;
        if (statusFilter === "inactive" && row.active) return false;
        if (q) {
          const hay = `${row.supermarket} ${row.product} ${row.quantity}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
      visible.sort((a, b) => {
        let av = a[sortKey] ?? "";
        let bv = b[sortKey] ?? "";
        if (sortKey === "from") { av = a.from_sort; bv = b.from_sort; }
        if (sortKey === "until") { av = a.until_sort; bv = b.until_sort; }
        let cmp;
        if (sortKey === "active") cmp = (a.active === b.active) ? 0 : a.active ? -1 : 1;
        else cmp = String(av).localeCompare(String(bv), undefined, { numeric: true });
        return sortDir === "asc" ? cmp : -cmp;
      });

      if (!visible.length) {
        const label = categoryTab === "fruit" ? "fruit" : "vegetable";
        tbody.innerHTML = `<tr class="empty-row"><td colspan="7">No ${label} promotions match your filters.</td></tr>`;
      } else {
        tbody.innerHTML = visible.map((row) => {
          const sc = storeClass(row.supermarket);
          return `
        <tr data-active="${row.active}">
          <td><span class="store ${sc}">${esc(row.supermarket)}</span></td>
          <td class="product-name">${esc(row.product)}</td>
          <td>${esc(row.quantity)}</td>
          <td class="price">${esc(row.price)}</td>
          <td>${esc(row.from)}</td>
          <td>${esc(row.until)}</td>
          <td><span class="badge ${row.active ? "active" : "inactive"}">${row.active ? "Active" : "Inactive"}</span></td>
        </tr>`;
        }).join("");
      }

      const inTab = ROWS.filter((r) => r.category === categoryTab).length;
      countEl.textContent = `${visible.length} of ${inTab} in tab`;
      document.querySelectorAll("th").forEach((th) => {
        th.dataset.sortDir = th.dataset.key === sortKey ? sortDir : "";
      });
    }

    function esc(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    document.querySelectorAll(".category-tabs button").forEach((btn) => {
      btn.addEventListener("click", () => {
        categoryTab = btn.dataset.category;
        document.querySelectorAll(".category-tabs button").forEach((b) => {
          b.setAttribute("aria-selected", b === btn ? "true" : "false");
        });
        render();
      });
    });

    document.querySelectorAll(".filters button").forEach((btn) => {
      btn.addEventListener("click", () => {
        statusFilter = btn.dataset.filter;
        document.querySelectorAll(".filters button").forEach((b) => {
          b.setAttribute("aria-pressed", b === btn ? "true" : "false");
        });
        render();
      });
    });

    searchEl.addEventListener("input", render);

    document.querySelectorAll("th[data-key]").forEach((th) => {
      th.addEventListener("click", () => {
        const key = th.dataset.key;
        if (sortKey === key) sortDir = sortDir === "asc" ? "desc" : "asc";
        else { sortKey = key; sortDir = "asc"; }
        render();
      });
    });

    async function fetchCsvText() {
      const res = await fetch(`${CSV_URL}?t=${Date.now()}`, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.text();
    }

    async function load() {
      try {
        const { generated, rows } = csvToRows(await fetchCsvText());
        ROWS = rows;
        if (generated) lastGenerated = generated;
        metaEl.classList.remove("error");
        metaEl.textContent = generated
          ? `Generated ${generated} Europe/Dublin`
          : (rows.length ? "Promotions loaded" : "No promotions in CSV");
        updateTabCounts();
        render();
        return true;
      } catch (err) {
        metaEl.classList.add("error");
        metaEl.textContent = `Could not load ${CSV_URL}: ${err.message}.`;
        countEl.textContent = "";
        return false;
      }
    }

    async function reloadData() {
      const prev = lastGenerated;
      refreshBtn.disabled = true;
      refreshBtn.textContent = "Reloading…";
      refreshHint.hidden = false;
      await load();
      refreshBtn.disabled = false;
      refreshBtn.textContent = "Reload data";
      refreshHint.textContent = lastGenerated && lastGenerated !== prev
        ? "Loaded newer data from GitHub."
        : "Same data as before. Run update locally and push to publish new leaflets.";
    }

    refreshBtn.addEventListener("click", reloadData);
    load();
  </script>
</body>
</html>
